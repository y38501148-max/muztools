[project]
name = "muztools"
version = "0.1.0"
description = "盐的工具箱后端：自动签到、TD/阳光查询与手动 TD、抖音续火花"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pycryptodome>=3.20",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
douyin = ["playwright>=1.49", "qrcode>=7.4"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
muz-admin = "muztool.cli:main"
muztools = "muztool.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["muztool", "muztool.checkin"]

[tool.setuptools.package-data]
muztool = ["web/*"]
