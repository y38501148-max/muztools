<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>盐的工具箱</title>
  <style>
    :root {
      --primary: #1e60d5;
      --primary-hover: #154fb3;
      --primary-soft: #e8f0fe;
      --primary-deep: #0f3b8f;
      --secondary: #4c6684;
      --bg: #f6f8fc;
      --card: #ffffff;
      --card-alt: #f0f4fa;
      --text: #181c20;
      --muted: #535d6e;
      --muted-light: #8896ab;
      --line: #e3e8f0;
      --line-subtle: #edf2f9;
      --ok: #1e8e3e;
      --ok-bg: #e8f7ee;
      --warn: #b45309;
      --warn-bg: #fff4d6;
      --err: #d93025;
      --err-bg: #fdecea;
      --spark: #e65100;
      --spark-soft: #fff3e0;
      --td: #0288d1;
      --td-soft: #e1f5fe;
      --shadow-sm: 0 2px 8px rgba(24, 44, 84, .04);
      --shadow: 0 8px 24px rgba(24, 44, 84, .07);
      --shadow-lg: 0 16px 40px rgba(30, 96, 213, .18);
      --radius-sm: 10px;
      --radius: 16px;
      --radius-lg: 22px;
      --radius-full: 9999px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
      border: none;
      outline: none;
    }
    button {
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all .18s cubic-bezier(0.4, 0, 0.2, 1);
    }
    button:active:not(:disabled) {
      transform: scale(0.98);
    }
    a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .hidden { display: none !important; }

    /* Layout Shell */
    .app-shell {
      max-width: 760px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .page {
      flex: 1;
      padding: 16px 16px 96px;
    }

    /* Typography */
    h1 { font-size: 26px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
    h2 { font-size: 20px; font-weight: 700; margin: 0; }
    h3 { font-size: 15px; font-weight: 700; margin: 0; }
    p { margin: 0; }
    .muted { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .muted-sm { color: var(--muted); font-size: 12px; }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      position: relative;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .card.click {
      cursor: pointer;
    }
    .card.click:hover {
      border-color: #cbdcf8;
      box-shadow: var(--shadow);
    }
    .card.click:active {
      transform: scale(0.99);
    }

    /* Hero Card */
    .hero {
      background: linear-gradient(135deg, #1e60d5 0%, #3d7ff5 100%);
      color: #ffffff;
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: '';
      position: absolute;
      right: -30px;
      bottom: -40px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }
    .hero .muted { color: rgba(255, 255, 255, 0.82); }

    .hero-stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    .hero-stat {
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius);
      padding: 12px 14px;
    }
    .hero-stat .label { font-size: 12px; color: rgba(255, 255, 255, 0.85); font-weight: 500; }
    .hero-stat .val { font-size: 22px; font-weight: 800; margin-top: 2px; }

    /* Topbars & Navigation */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
      min-height: 44px;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--primary-soft);
      color: var(--primary);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
      flex-shrink: 0;
    }

    /* Fixed Bottom Nav Bar */
    .nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(760px, 100%);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--line);
      display: flex;
      padding-bottom: max(env(safe-area-inset-bottom), 6px);
      padding-top: 4px;
      z-index: 100;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.03);
    }
    .nav button {
      flex: 1;
      background: none;
      border: 0;
      color: var(--muted);
      padding: 6px 0 6px;
      font-weight: 600;
      font-size: 11px;
      flex-direction: column;
      gap: 3px;
      border-radius: 12px;
      margin: 2px 6px;
    }
    .nav button .nav-icon {
      font-size: 18px;
      line-height: 1;
    }
    .nav button.active {
      color: var(--primary);
      font-weight: 700;
    }
    .nav button.active .nav-icon {
      transform: scale(1.1);
    }

    /* Grids & Flex Layouts */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-1 { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .row { display: flex; gap: 10px; align-items: center; }
    .row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .center { text-align: center; }

    /* Buttons */
    .btn {
      border-radius: var(--radius);
      padding: 10px 16px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      height: 42px;
      box-shadow: 0 2px 6px rgba(30, 96, 213, 0.2);
    }
    .btn:hover:not(:disabled) {
      background: var(--primary-hover);
    }
    .btn.soft {
      background: var(--primary-soft);
      color: var(--primary-deep);
      box-shadow: none;
    }
    .btn.soft:hover:not(:disabled) {
      background: #d6e4fd;
    }
    .btn.ghost {
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
    }
    .btn.ghost:hover:not(:disabled) {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    .btn.danger {
      background: var(--err-bg);
      color: var(--err);
      box-shadow: none;
    }
    .btn.danger:hover:not(:disabled) {
      background: #fcdbd8;
    }
    .btn.sm {
      padding: 6px 12px;
      height: 32px;
      font-size: 12px;
      border-radius: var(--radius-sm);
    }
    .btn.wide {
      width: 100%;
    }
    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }
    .btn.loading {
      pointer-events: none;
      position: relative;
      color: transparent !important;
    }
    .btn.loading::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      top: 50%;
      left: 50%;
      margin: -9px 0 0 -9px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    .btn.soft.loading::after, .btn.ghost.loading::after {
      border: 2px solid rgba(30, 96, 213, 0.2);
      border-top-color: var(--primary);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Inputs */
    .input-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin: 0 0 6px 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    input, textarea, select {
      width: 100%;
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 14px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30, 96, 213, 0.12);
    }
    input::placeholder, textarea::placeholder {
      color: #9aa5b8;
    }
    textarea {
      min-height: 90px;
      resize: vertical;
      line-height: 1.4;
    }

    /* Badges */
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: var(--radius-full);
      background: var(--primary-soft);
      color: var(--primary-deep);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .badge.ok { background: var(--ok-bg); color: var(--ok); }
    .badge.warn { background: var(--warn-bg); color: var(--warn); }
    .badge.err { background: var(--err-bg); color: var(--err); }
    .badge.gray { background: #eef2f8; color: var(--muted); }

    /* Icons */
    .icon-box {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    /* List items */
    .list-item {
      padding: 12px 0;
      border-top: 1px solid var(--line-subtle);
    }
    .list-item:first-child {
      border-top: 0;
      padding-top: 2px;
    }
    .list-item:last-child {
      padding-bottom: 2px;
    }

    /* Keep long lists inside a compact, independently scrollable viewport. */
    .scroll-window {
      max-height: 320px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      -webkit-overflow-scrolling: touch;
    }
    .scroll-window::-webkit-scrollbar {
      width: 6px;
    }
    .scroll-window::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }
    .scroll-window::-webkit-scrollbar-track {
      background: transparent;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      left: 50%;
      top: 20px;
      transform: translateX(-50%) translateY(-20px);
      background: #1e293b;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      z-index: 10000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      max-width: 90%;
      opacity: 0;
      pointer-events: none;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    /* Modal / Dialog */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      background: #ffffff;
      border-radius: 24px;
      padding: 20px;
      width: min(440px, 100%);
      box-shadow: var(--shadow-lg);
      transform: scale(0.95);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-backdrop.show .modal-box {
      transform: scale(1);
    }

    /* Auth View Specific */
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      background: linear-gradient(180deg, #e8f0fe 0%, #f6f8fc 38%);
    }
    .auth-card {
      width: min(420px, 100%);
    }
    .auth-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 2px 0 14px;
    }
    .auth-option {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }
    .auth-option input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--primary);
    }

    /* QR Code Display */
    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      background: var(--card-alt);
      border-radius: var(--radius);
      margin: 12px 0;
    }
    .qr-img {
      width: 210px;
      height: 210px;
      background: #ffffff;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      object-fit: contain;
      padding: 8px;
    }

    .empty-state {
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
    }
    .empty-icon {
      font-size: 32px;
      margin-bottom: 8px;
      opacity: 0.6;
    }

    /* Section header */
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 14px 0 8px 4px;
    }
  </style>
</head>
<body>
  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- Global Modal Container -->
  <div id="modal-container" class="modal-backdrop"></div>

  <!-- Main Shell -->
  <div class="app-shell">

    <!-- Auth View (Login / Register) -->
    <section id="auth-screen" class="auth-wrap">
      <div class="auth-card">
        <div class="brand" style="justify-content: center; margin-bottom: 20px;">
          <div class="logo" style="width: 48px; height: 48px; font-size: 24px; border-radius: 16px;">盐</div>
          <div>
            <h1 style="font-size: 24px; color: var(--primary);">盐的工具箱</h1>
            <p class="muted-sm">自动签到 · TD/阳光 · 抖音续火花</p>
          </div>
        </div>

        <div class="card" style="padding: 22px;">
          <h2 id="auth-title" style="margin-bottom: 16px; font-size: 18px;">账号登录</h2>

          <div class="input-group">
            <label for="auth-user">用户名</label>
            <input type="text" id="auth-user" autocomplete="username" placeholder="6～18 位字母、数字或下划线" />
          </div>

          <div id="auth-nick-wrap" class="input-group hidden">
            <label for="auth-nick">显示名（昵称）</label>
            <input type="text" id="auth-nick" placeholder="同学怎么称呼你" />
          </div>
          <div id="auth-invite-wrap" class="input-group hidden">
            <label for="auth-invite">邀请码</label>
            <input type="text" id="auth-invite" autocomplete="off" placeholder="请输入有效邀请码" />
          </div>

          <div class="input-group">
            <label for="auth-pass">密码</label>
            <div style="position: relative;">
              <input type="password" id="auth-pass" autocomplete="current-password" placeholder="注册密码须为 10～64 位并含大小写、数字和特殊字符" style="padding-right: 42px;" />
              <button type="button" id="btn-toggle-pass" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; color: var(--muted); font-size: 16px; padding: 4px;">👁</button>
            </div>
          </div>

          <div id="auth-options" class="auth-options">
            <label class="auth-option" for="auth-save-login">
              <input type="checkbox" id="auth-save-login" checked />
              <span>保持登录</span>
            </label>
          </div>
          <p id="auth-save-hint" class="muted-sm" style="margin: -4px 0 12px; line-height: 1.5;">仅在本浏览器保存，清除浏览器数据后会失效。</p>

          <button type="button" class="btn wide" id="auth-submit" style="margin-top: 4px; height: 46px; font-size: 15px;">登 录</button>

          <div class="center" style="margin-top: 16px;">
            <a href="#/register" id="auth-switch-link" data-nav="register" style="font-size: 13px;">没有账号？去注册</a>
          </div>
        </div>
      </div>
    </section>

    <!-- App View (Logged in) -->
    <section id="app-screen" class="hidden">
      <!-- Dynamic Page Container -->
      <main class="page" id="view-container"></main>

      <!-- Bottom Tabbar -->
      <nav class="nav" id="tabbar">
        <button type="button" data-nav="home" id="tab-home" class="active">
          <span class="nav-icon">🏠</span>
          <span>首页</span>
        </button>
        <button type="button" data-nav="features" id="tab-features">
          <span class="nav-icon">⚡</span>
          <span>功能</span>
        </button>
        <button type="button" data-nav="profile" id="tab-profile">
          <span class="nav-icon">👤</span>
          <span>我的</span>
        </button>
      </nav>
    </section>

  </div>

<script src="/assets/aes-gcm.min.js"></script>
<script>
/**
 * 盐的工具箱 - 现代化 Web 前端核心逻辑 (IIFE 保证全局干净，杜绝 window.top 等全局变量冲突)
 */
(() => {
  // 状态中心
  const STORAGE_KEYS = {
    token: "muz_token",
    username: "muz_username",
    legacyCredential: "muz_legacy_credential",
    legacyRemember: "muz_legacy_remember",
    saveLogin: "muz_save_login"
  };

  function readStoredToken() {
    const localToken = localStorage.getItem(STORAGE_KEYS.token) || "";
    const sessionToken = sessionStorage.getItem(STORAGE_KEYS.token) || "";
    const keepLogin = localStorage.getItem(STORAGE_KEYS.saveLogin) === "true";
    if (!localToken && sessionToken && keepLogin) {
      localStorage.setItem(STORAGE_KEYS.token, sessionToken);
      sessionStorage.removeItem(STORAGE_KEYS.token);
      return sessionToken;
    }
    return localToken || sessionToken;
  }

  const state = {
    token: readStoredToken(),
    user: null,
    student: {},
    home: {},
    notes: [],
    douyinSession: null,
    signinSchedule: null,
    tdStatus: null,
    sunshineStatus: null,
    qrTimer: null,
    qrSessionId: null,
    sparkTargets: [],
    douyinFriendResults: [],
    douyinFriendsLoaded: false,
    douyinFriendsLoading: false,
    douyinFriendsError: "",
    douyinFriendsCachedAt: "",
    douyinFriendQuery: "",
    checkinProviders: null,
    checkinProvider: "",
    checkinConfigs: {},
    checkinEditingToken: false,
    checkinCode: "",
    checkinActivity: null,
    checkinValues: {},
    checkinLocation: {lng: "", lat: ""},
    checkinResult: null,
    checkinError: "",
    tiboHistory: null,
    liveSocket: null,
    liveReconnectTimer: null
  };

  // DOM 辅助
  const $ = (id) => document.getElementById(id);

  // 文本转义防止 XSS
  function esc(str) {
    return String(str ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c]));
  }

  // 统一状态徽章渲染
  function renderBadge(statusVal) {
    const map = {
      approved: ["ok", "已通过"],
      verified: ["ok", "已认证"],
      signed: ["ok", "已签到"],
      success: ["ok", "成功"],
      connected: ["ok", "已登录"],
      valid: ["ok", "有效"],
      available: ["ok", "可用"],
      pending: ["warn", "待处理"],
      scanned: ["warn", "已扫码"],
      unbound: ["gray", "未绑定"],
      none: ["gray", "未配置"],
      rejected: ["err", "已拒绝"],
      failed: ["err", "失败"],
      expired: ["err", "已过期"],
      cancelled: ["gray", "已取消"]
    };
    const [cls, text] = map[statusVal] || ["gray", statusVal || "未知"];
    return `<span class="badge ${cls}">${esc(text)}</span>`;
  }

  // Toast 提示框
  let toastTimer = null;
  function toast(msg, type = "info") {
    const el = $("toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      el.classList.remove("show");
    }, 2800);
  }

  // 规范化后端 FastAPI 错误
  function parseApiError(data, statusText) {
    if (!data) return statusText || "网络连接异常";
    if (typeof data === "string") return data;
    if (typeof data.detail === "string") return data.detail;
    if (Array.isArray(data.detail)) {
      return data.detail.map(item => {
        const field = Array.isArray(item.loc) ? item.loc.filter(k => k !== "body").join(".") : "";
        return (field ? field + ": " : "") + (item.msg || "格式有误");
      }).join("; ") || "请求参数有误";
    }
    if (typeof data.detail === "object" && data.detail !== null) {
      return JSON.stringify(data.detail);
    }
    if (typeof data.message === "string") return data.message;
    if (typeof data.error === "string") return data.error;
    return statusText || "操作失败";
  }

  // API 网络请求封装
  async function api(path, opts = {}, allowSessionRetry = true) {
    const headers = { "Accept": "application/json", ...(opts.headers || {}) };
    if (state.token) {
      headers.Authorization = "Bearer " + state.token;
    }
    if (opts.body && !(opts.body instanceof FormData) && !headers["Content-Type"]) {
      headers["Content-Type"] = "application/json";
    }

    const fetchOpts = {
      credentials: "same-origin",
      ...opts,
      headers,
      body: opts.body instanceof FormData || typeof opts.body === "string"
        ? opts.body
        : opts.body ? JSON.stringify(opts.body) : undefined
    };

    const res = await fetch(path, fetchOpts);
    const text = await res.text();
    let data = {};
    try {
      data = text ? JSON.parse(text) : {};
    } catch {
      data = { detail: text };
    }

    if (!res.ok) {
      if (res.status === 401) {
        const keepLogin = localStorage.getItem(STORAGE_KEYS.saveLogin) === "true";
        if (allowSessionRetry && keepLogin && await restorePersistentSession()) {
          return api(path, opts, false);
        }
        clearAuthState();
        switchRoute("login");
      }
      const errText = parseApiError(data, res.statusText);
      throw new Error(errText);
    }
    return data;
  }

  function persistAuthToken(token, saveLogin) {

  let transportKeyCache = null;

  function bytesToBigInt(bytes) {
    let value = 0n;
    for (const byte of bytes) value = (value << 8n) | BigInt(byte);
    return value;
  }

  function bigIntToBytes(value, length) {
    const out = new Uint8Array(length);
    for (let i = length - 1; i >= 0; i--) { out[i] = Number(value & 255n); value >>= 8n; }
    return out;
  }

  function modPow(base, exponent, modulus) {
    let result = 1n;
    base %= modulus;
    while (exponent > 0n) {
      if (exponent & 1n) result = (result * base) % modulus;
      exponent >>= 1n;
      base = (base * base) % modulus;
    }
    return result;
  }

  function bytesToBase64(bytes) {
    let binary = "";
    for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(binary);
  }

  async function getTransportKey() {
    if (transportKeyCache) return transportKeyCache;
    const response = await fetch("/api/security/public-key", {cache: "no-store"});
    if (!response.ok) throw new Error("无法获取安全传输密钥");
    transportKeyCache = await response.json();
    return transportKeyCache;
  }

  async function rsaEncryptBytes(message) {
    const key = await getTransportKey();
    if (!(message instanceof Uint8Array)) message = new Uint8Array(message);
    const size = Number(key.key_size);
    if (message.length > size - 11) throw new Error("加密字段过长");
    const encoded = new Uint8Array(size);
    encoded[0] = 0; encoded[1] = 2;
    const paddingLength = size - message.length - 3;
    const random = new Uint8Array(paddingLength);
    crypto.getRandomValues(random);
    for (let i = 0; i < random.length; i++) {
      while (random[i] === 0) crypto.getRandomValues(random.subarray(i, i + 1));
      encoded[i + 2] = random[i];
    }
    encoded[2 + paddingLength] = 0;
    encoded.set(message, 3 + paddingLength);
    const modulus = BigInt("0x" + key.modulus_hex);
    const exponent = BigInt(key.exponent);
    return bytesToBase64(bigIntToBytes(modPow(bytesToBigInt(encoded), exponent, modulus), size));
  }

  async function encryptCredential(value) {
    return rsaEncryptBytes(new TextEncoder().encode(String(value ?? "")));
  }

  async function encryptLargeSecret(value) {
    const plaintext = new TextEncoder().encode(String(value ?? ""));
    if (plaintext.length > 256 * 1024) throw new Error("Cookie 内容过长");
    const aesKey = crypto.getRandomValues(new Uint8Array(32));
    const nonce = crypto.getRandomValues(new Uint8Array(12));
    let sealed;
    if (crypto.subtle) {
      const imported = await crypto.subtle.importKey("raw", aesKey, {name: "AES-GCM"}, false, ["encrypt"]);
      sealed = new Uint8Array(await crypto.subtle.encrypt({name: "AES-GCM", iv: nonce, tagLength: 128}, imported, plaintext));
    } else if (typeof globalThis.muzAesGcmEncrypt === "function") {
      sealed = globalThis.muzAesGcmEncrypt(aesKey, nonce, plaintext);
    } else {
      throw new Error("当前浏览器不支持 Cookie 安全加密，请更新浏览器后重试");
    }
    return {
      key: await rsaEncryptBytes(aesKey),
      nonce: bytesToBase64(nonce),
      ciphertext: bytesToBase64(sealed)
    };
  }

  async function encryptedFields(fields) {
    const entries = await Promise.all(Object.entries(fields).map(async ([name, value]) => [name, await encryptCredential(value)]));
    return Object.fromEntries(entries);
  }

  async function restorePersistentSession() {
    try {
      const headers = { "Accept": "application/json" };
      // A valid local persistent token can recreate the HttpOnly cookie if the
      // browser discarded only its cookie storage.
      if (state.token) headers.Authorization = "Bearer " + state.token;
      const res = await fetch("/api/auth/session", {
        method: "GET",
        credentials: "same-origin",
        headers
      });
      if (!res.ok) return false;
      const data = await res.json();
      if (!data.token) return false;
      state.token = data.token;
      persistAuthToken(data.token, true);
      localStorage.setItem(STORAGE_KEYS.saveLogin, "true");
      return true;
    } catch {
      return false;
    }
  }

  function normalizeSparkTarget(target) {
    const message = String(target?.message || "").trim();
    const mode = target?.mode === "custom" || (!target?.mode && message) ? "custom" : "standard";
    const conversationType = ["direct", "group"].includes(target?.conversation_type) ? target.conversation_type : "";
    return {
      name: String(target?.name || "").trim(),
      mode,
      message: mode === "custom" ? message : "",
      conversation_id: String(target?.conversation_id || "").trim(),
      conversation_short_id: String(target?.conversation_short_id || "").trim(),
      conversation_type: conversationType
    };
  }

  function sparkConversationKey(item) {
    const id = String(item?.conversation_id || "").trim();
    if (id) return `id:${id}`;
    return `${String(item?.conversation_type || "unknown")}:${String(item?.name || "").trim()}`;
  }

  function renderSparkTargetRows(targets = state.sparkTargets) {
    if (!targets.length) {
      return `<div class="empty-state" style="padding: 20px 10px;">先从上方读取到的好友列表中选择并添加</div>`;
    }
    const dy = state.douyinSession?.douyin || state.douyinSession || {};
    const statuses = dy.target_status || {};
    return targets.map((target, index) => {
      const stable = Boolean(target.conversation_id && ["direct", "group"].includes(target.conversation_type));
      const status = statuses[sparkConversationKey(target)] || {};
      return `
      <div class="list-item spark-target-row" data-index="${index}">
        <div style="flex: 1; min-width: 0;">
          <div class="row-between" style="align-items: flex-start;">
            <div>
              <b>${esc(target.name)} ${target.conversation_type === "group" ? `<span class="badge approved" style="margin-left:6px;">群聊</span>` : ""} ${stable ? "" : `<span class="badge rejected" style="margin-left:6px;">需重新添加</span>`}</b>
              <p class="muted-sm" style="margin-top: 3px;">${target.mode === "custom" ? "自定义模式" : "标准模式：使用默认续火花文案"}</p>
              ${status.last_attempt ? `<p class="muted-sm" style="margin-top:3px;">最近结果：${esc(status.status || "未知")} · ${esc(String(status.last_attempt).replace("T", " ").split("+")[0])}${status.error ? ` · ${esc(status.error)}` : ""}</p>` : ""}
            </div>
            <div class="row" style="gap: 6px; flex: 0 0 auto;">
              <button type="button" class="btn ghost sm" data-action="run-spark-target" data-index="${index}" ${stable ? "" : "disabled"}>单独测试</button>
              <button type="button" class="btn ghost sm" data-action="remove-spark-target" data-index="${index}">移除</button>
            </div>
          </div>
          <div class="row" style="margin-top: 10px; align-items: stretch; flex-wrap: wrap;">
            <select class="spark-target-mode" data-index="${index}" style="flex: 0 0 130px;">
              <option value="standard" ${target.mode === "standard" ? "selected" : ""}>标准模式</option>
              <option value="custom" ${target.mode === "custom" ? "selected" : ""}>自定义模式</option>
            </select>
            <input class="spark-target-message" data-index="${index}" type="text" value="${esc(target.message)}"
              placeholder="输入该好友专用文案" style="flex: 1; min-width: 190px;" ${target.mode === "custom" ? "" : "disabled"} />
          </div>
        </div>
      </div>`;
    }).join("");
  }

  function readSparkConfigFromForm() {
    const defaultMessage = ($("spark-default-msg")?.value || "").trim();
    const hour = Number($("spark-hour")?.value || 9);
    const targets = Array.from(document.querySelectorAll(".spark-target-row")).map((row) => {
      const index = Number(row.dataset.index);
      const current = state.sparkTargets[index] || {};
      const mode = row.querySelector(".spark-target-mode")?.value === "custom" ? "custom" : "standard";
      const message = mode === "custom" ? (row.querySelector(".spark-target-message")?.value || "").trim() : "";
      return normalizeSparkTarget({
        name: current.name || "",
        mode,
        message,
        conversation_id: current.conversation_id || "",
        conversation_short_id: current.conversation_short_id || "",
        conversation_type: current.conversation_type || ""
      });
    }).filter(target => target.name);
    state.sparkTargets = targets;
    return {
      enabled: Boolean(state.douyinSession?.douyin?.enabled ?? state.douyinSession?.enabled),
      default_message: defaultMessage,
      hour,
      targets
    };
  }

  function filteredDouyinFriends() {
    const liveQuery = $("spark-friend-search")?.value ?? state.douyinFriendQuery;

    if (!query) return state.douyinFriendResults;
    return state.douyinFriendResults.filter(friend => String(friend.name || "").toLocaleLowerCase().includes(query));
  }

  function renderDouyinFriendResults(friends = filteredDouyinFriends()) {
    if (state.douyinFriendsLoading && !state.douyinFriendsLoaded) {
      return `<div class="empty-state" style="padding: 18px 10px;">正在读取好友缓存；若尚无缓存，将从抖音拉取一次...</div>`;

      return `<p class="muted-sm" style="padding: 10px 2px; color: var(--danger);">${esc(state.douyinFriendsError)}</p>`;
    }
    if (!state.douyinFriendsLoaded) {
      return `<p class="muted-sm" style="padding: 10px 2px;">绑定 Cookie 后会自动读取抖音聊天好友列表。</p>`;
    }
    if (!friends.length) {
      const hasQuery = Boolean(String(state.douyinFriendQuery || "").trim());
      return `<p class="muted-sm" style="padding: 10px 2px;">${hasQuery ? "当前筛选没有匹配好友。" : "未读取到聊天好友，请确认抖音聊天页中已有会话。"}</p>`;
    }
    const selected = new Set(state.sparkTargets.map(sparkConversationKey));
    const loadingBanner = state.douyinFriendsLoading
      ? `<p class="muted-sm" style="padding: 8px 2px;">正在从抖音更新好友缓存，当前仍显示旧缓存...</p>`
      : "";
    return loadingBanner + friends.map(friend => {
      const added = selected.has(sparkConversationKey(friend));
      const stable = Boolean(friend.conversation_id && ["direct", "group"].includes(friend.conversation_type));
      return `
        <div class="list-item">
          <div class="row" style="flex: 1; min-width: 0;">
            ${friend.avatar_url ? `<img src="${esc(friend.avatar_url)}" alt="" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover;" />` : `<div class="icon-box" style="width:36px;height:36px;border-radius:50%;">${friend.conversation_type === "group" ? "👥" : "👤"}</div>`}
            <div style="min-width:0;">
              <b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;">${esc(friend.name)}</b>
              <span class="muted-sm">${friend.conversation_type === "group" ? "群聊" : (friend.conversation_type === "direct" ? "好友" : "缺少稳定标识")}</span>
            </div>
          </div>
          <button type="button" class="btn ${added ? "ghost" : "soft"} sm" data-action="add-spark-friend"
            data-name="${esc(friend.name)}" data-conversation-id="${esc(friend.conversation_id || "")}" data-conversation-short-id="${esc(friend.conversation_short_id || "")}" data-conversation-type="${esc(friend.conversation_type || "")}" ${added || !stable ? "disabled" : ""}>
            ${added ? "已添加" : (stable ? "添加" : "不可添加")}
          </button>
        </div>`;
    }).join("");

  }


  function refreshSparkFriendEditors() {
    const targetBox = $("spark-target-list");
    if (targetBox) targetBox.innerHTML = renderSparkTargetRows();
    const resultBox = $("spark-friend-results");
    if (resultBox) resultBox.innerHTML = renderDouyinFriendResults();
    const countBox = $("spark-friend-count");
    if (countBox) {
      countBox.textContent = state.douyinFriendsLoaded
        ? `已缓存 ${state.douyinFriendResults.length} 位聊天好友；仅点击“重新读取好友”时更新缓存。`
        : "将优先读取好友缓存；尚无缓存时才会自动从抖音拉取一次。";
    }
  }

  async function loadDouyinFriendList(button = null, forceRefresh = false) {
    if (state.douyinFriendsLoading) return;
    const hadLoadedCache = state.douyinFriendsLoaded;
    state.douyinFriendsLoading = true;
    state.douyinFriendsError = "";
    refreshSparkFriendEditors();
    if (button) {
      button.disabled = true;
      button.classList.add("loading");
    }
    try {
      const path = forceRefresh ? "/api/douyin/friends?refresh=1" : "/api/douyin/friends";
      const result = await api(path);
      state.douyinFriendResults = Array.isArray(result.friends) ? result.friends : [];
      state.douyinFriendsCachedAt = String(result.cached_at || "");
      state.douyinFriendsLoaded = true;
      if (button) toast(`好友缓存已更新，共 ${state.douyinFriendResults.length} 位`);
    } catch (err) {
      if (!hadLoadedCache) state.douyinFriendsLoaded = false;
      state.douyinFriendsError = hadLoadedCache ? "" : (err.message || "读取好友列表失败");
      if (button) toast(err.message || "刷新好友列表失败，已保留原缓存", "error");
    } finally {
      state.douyinFriendsLoading = false;
      if (button) {
        button.disabled = false;
        button.classList.remove("loading");
      }
      refreshSparkFriendEditors();
    }
  }

  /* ================== 事件处理与动作委托 ================== */

  // 按钮 Loading 辅助
  async function withButtonLoading(btn, asyncFn) {
    if (!btn || btn.disabled) return;
    btn.disabled = true;
    btn.classList.add("loading");
    try {
      await asyncFn();
    } catch (err) {
      toast(err.message, "error");
    } finally {
      btn.disabled = false;
      btn.classList.remove("loading");
    }
  }

  // 抖音扫码登录轮询
  async function startSparkQrLogin(btn) {
    const qrBox = $("spark-qr-box");
    const qrImg = $("spark-qr-img");
    const qrStatus = $("spark-qr-status");
    if (!qrBox || !qrImg || !qrStatus) return;

    qrBox.classList.remove("hidden");
    qrStatus.textContent = "正在生成登录二维码...";

    try {
      const res = await api("/api/douyin/qr/start", { method: "POST", body: {} });
      state.qrSessionId = res.login_id;
      if (res.qr_image) {
        qrImg.src = "data:image/png;base64," + res.qr_image;
      }
      qrStatus.textContent = "请打开抖音 App 扫一扫登录";

      if (state.qrTimer) clearInterval(state.qrTimer);
      state.qrTimer = setInterval(async () => {
        try {
          if (!state.qrSessionId) return;
          const st = await api("/api/douyin/qr/status?login_id=" + encodeURIComponent(state.qrSessionId));
          if (st.qr_image) qrImg.src = "data:image/png;base64," + st.qr_image;
          if (st.status === "scanned") {
            qrStatus.textContent = st.error || "已扫码或确认登录，正在获取 Cookie，请稍候...";
          } else if (st.status === "success" || st.valid) {
            clearInterval(state.qrTimer);
            state.qrTimer = null;
            state.qrSessionId = null;
            toast("抖音登录成功，Cookie 已保存！");
            qrBox.classList.add("hidden");
            await refreshAllData();
            await renderPage();
          } else if (["failed", "expired", "cancelled"].includes(st.status)) {
            clearInterval(state.qrTimer);
            state.qrTimer = null;
            qrStatus.textContent = st.error || "二维码已失效，请重新扫码";
          }
        } catch (pollErr) {
          qrStatus.textContent = pollErr.message;
        }
      }, 2000);
    } catch (err) {
      qrStatus.textContent = err.message;
      toast(err.message, "error");
    }
  }

  function cancelSparkQrLogin() {
    if (state.qrTimer) {
      clearInterval(state.qrTimer);
      state.qrTimer = null;
    }
    const loginId = state.qrSessionId;
    state.qrSessionId = null;
    if (loginId) {
      api("/api/douyin/qr/cancel", {
        method: "POST",
        body: { login_id: loginId }
      }).catch(() => {});
    }
    const qrBox = $("spark-qr-box");
    if (qrBox) qrBox.classList.add("hidden");
  }

  // 统一事件委托监听器
  document.addEventListener("click", async (e) => {
    // 1. 路由跳转 data-nav
    const navBtn = e.target.closest("[data-nav]");
    if (navBtn) {
      e.preventDefault();
      const route = navBtn.dataset.nav;
      if (route === "checkin") {
        state.checkinProvider = "";
        state.checkinActivity = null;
        state.checkinValues = {};
        state.checkinLocation = {lng: "", lat: ""};
        state.checkinResult = null;
        state.checkinError = "";
        state.checkinEditingToken = false;
      }
      if (route) switchRoute(route);
      return;
    }

    // 2. 密码可见性切换
    const togglePass = e.target.closest("#btn-toggle-pass");
    if (togglePass) {
      const input = $("auth-pass");
      if (input) {
        const isPass = input.type === "password";
        input.type = isPass ? "text" : "password";
        togglePass.textContent = isPass ? "🔒" : "👁";
      }
      return;
    }

    // 3. 登录/注册主按钮
    const authSubmit = e.target.closest("#auth-submit");
    if (authSubmit) {
      e.preventDefault();
      await withButtonLoading(authSubmit, async () => {
        const isReg = getRoute() === "register";
        const username = $("auth-user").value.trim();
        const password = $("auth-pass").value;
        const displayName = $("auth-nick") ? $("auth-nick").value.trim() : "";
        const inviteCode = $("auth-invite") ? $("auth-invite").value.trim() : "";

        if (!username || !password) throw new Error("用户名和密码不能为空");
        if (isReg) {
          if (password.length < 10 || password.length > 64) throw new Error("密码须为 10～64 位");
          if (!/[a-z]/.test(password) || !/[A-Z]/.test(password) || !/[0-9]/.test(password) || !/[^\p{L}\p{N}]/u.test(password)) {
            throw new Error("密码必须包含大写字母、小写字母、数字和特殊字符");
          }
        }
        if (isReg && !inviteCode) throw new Error("请输入邀请码");

        const rememberPassword = false;
        const saveLogin = isReg || Boolean($("auth-save-login")?.checked);
        const encrypted = await encryptedFields(isReg
          ? {username, password, display_name: displayName || username, invite_code: inviteCode}
          : {username, password});
        const payload = { encrypted, keep_login: isReg ? true : saveLogin };

        const res = await api(isReg ? "/api/auth/register" : "/api/auth/login", {
          method: "POST",
          body: payload
        });

        if (!res.token) throw new Error("服务器未返回有效登录凭证");
        if (!isReg) {
          persistAuthPreferences(username, password, rememberPassword, saveLogin);
        } else {
          persistAuthPreferences(username, "", false, true);
        }
        state.token = res.token;
        persistAuthToken(res.token, isReg || saveLogin);
        toast(isReg ? "注册成功，已自动登录" : "登录成功");
        switchRoute("home");
        await bootApp();
      });
      return;
    }

    // 4. Modal 关闭
    const modalClose = e.target.closest("[data-action='close-modal']");
    if (modalClose || e.target.id === "modal-container") {
      closeModal();
      return;
    }

    // 5. 各种具体业务动作
    const actionBtn = e.target.closest("[data-action]");
    if (!actionBtn) return;
    const action = actionBtn.dataset.action;

    // 刷新当前页面
    if (action === "refresh-view") {
      await withButtonLoading(actionBtn, async () => {
        await refreshAllData(true);
        await renderPage();
        toast("已刷新");
      });
      return;
    }

    if (action === "issue-invite") {
      await withButtonLoading(actionBtn, async () => {
        const result = await api("/api/invites/issue", {method: "POST", body: {}});
        showModal(`<h3>注册邀请码</h3><p class="muted-sm" style="margin:10px 0;">该邀请码只能使用一次，请通过可信渠道发送。</p><div class="card" style="font-size:20px;font-weight:700;letter-spacing:2px;text-align:center;user-select:all;">${esc(result.code)}</div><p class="muted-sm" style="margin-top:10px;">库存剩余 ${Number(result.remaining || 0)} 个</p><button class="btn wide" data-action="close-modal" style="margin-top:14px;">关闭</button>`);
      });
      return;
    }

    // 开关 Tibo 系统推送
    if (action === "toggle-tibo") {
      const enable = actionBtn.dataset.enable === "true";
      await withButtonLoading(actionBtn, async () => {
        const result = await api("/api/tibo/config", {
          method: "PUT",
          body: { enabled: enable }
        });
        if (state.tiboHistory) state.tiboHistory.enabled = Boolean(result.enabled);
        if (state.user) state.user.tibo = { enabled: Boolean(result.enabled) };
        toast(result.message || (result.enabled ? "Tibo 推送已开启" : "Tibo 推送已关闭"));
        await renderPage();
      });
      return;
    }

    // 打开 X Cookie 导入弹窗
    if (action === "open-tibo-cookie-dialog") {
      openTiboCookieModal();
      return;
    }

    // 提交 X Cookie 导入
    if (action === "submit-tibo-cookies") {
      await withButtonLoading(actionBtn, async () => {
        const cookies = $("modal-tibo-cookies").value.trim();
        if (!cookies) throw new Error("请输入 Cookie 内容");
        await api("/api/tibo/x-session", {
          method: "POST",
          body: { encrypted_secret: await encryptLargeSecret(cookies) }
        });
        closeModal();
        toast("X Cookie 导入成功");
        await renderPage();
      });
      return;
    }

    // 移除已保存的 X Cookie
    if (action === "remove-tibo-x-cookie") {
      await withButtonLoading(actionBtn, async () => {
        await api("/api/tibo/x-session", { method: "DELETE" });
        toast("已移除 X Cookie");
        await renderPage();
      });
      return;
    }


    // 签到工具：板块导航 / Token 保存 / 查询 / 签到
    if (action === "checkin-open-provider") {
      const providerId = String(actionBtn.dataset.provider || "").trim();
      if (!providerId) return;
      state.checkinProvider = providerId;
      state.checkinActivity = null;
      state.checkinValues = {};
      state.checkinLocation = {lng: "", lat: ""};
      state.checkinResult = null;
      state.checkinError = "";
      state.checkinEditingToken = false;
      await renderPage();
      return;
    }

    if (action === "checkin-back-providers") {
      state.checkinProvider = "";
      state.checkinActivity = null;
      state.checkinValues = {};
      state.checkinLocation = {lng: "", lat: ""};
      state.checkinResult = null;
      state.checkinError = "";
      state.checkinEditingToken = false;
      await renderPage();
      return;
    }

    if (action === "checkin-paste-token") {
      const input = $("checkin-token-input");
      if (!input) return;
      try {
        if (!navigator.clipboard || !navigator.clipboard.readText) {
          throw new Error("当前浏览器不支持读取剪贴板，请长按输入框手动粘贴");
        }
        const text = (await navigator.clipboard.readText()).trim();
        if (!text) throw new Error("剪贴板中没有可用的 Token");
        input.value = text;
        input.focus();
        toast("已从剪贴板粘贴，请确认后保存");
      } catch (err) {
        toast(err.message || "读取剪贴板失败，请手动粘贴", "error");
      }
      return;
    }

    if (action === "checkin-save-token") {
      await withButtonLoading(actionBtn, async () => {
        const input = $("checkin-token-input");
        const token = (input && input.value || "").trim();
        if (!token) { toast("请输入签到 token"); return; }
        const providerId = state.checkinProvider;
        const payload = {encrypted: await encryptedFields({token})};
        const result = await api(`/api/checkin/${encodeURIComponent(providerId)}/config`, {method: "PUT", body: payload});
        state.checkinConfigs[providerId] = result;
        state.checkinEditingToken = false;
        state.checkinResult = null;
        state.checkinError = "";
        toast(result.message || "签到 token 已保存");
        await renderPage();
      });
      return;
    }

    if (action === "checkin-edit-token") {
      state.checkinEditingToken = true;
      await renderPage();
      return;
    }

    if (action === "checkin-cancel-edit-token") {
      state.checkinEditingToken = false;
      await renderPage();
      return;
    }

    if (action === "checkin-preview") {
      await withButtonLoading(actionBtn, async () => {
        const input = $("checkin-code-input");
        const code = (input && input.value || "").trim();
        if (!code) { toast("请输入活动码"); return; }
        state.checkinCode = code;
        state.checkinError = "";
        try {
          const result = await api(`/api/checkin/${encodeURIComponent(state.checkinProvider)}/preview`, {method: "POST", body: {code}});
          state.checkinActivity = result.activity || null;
          state.checkinValues = {};
          state.checkinLocation = {
            lng: result.activity?.location_longitude || "",
            lat: result.activity?.location_latitude || ""
          };
          state.checkinResult = null;
        } catch (err) {
          state.checkinActivity = null;
          state.checkinError = err.message;
        }
        await renderPage();
      });
      return;
    }

    if (action === "checkin-sign") {
      await withButtonLoading(actionBtn, async () => {
        const activity = state.checkinActivity;
        if (!activity || !activity.code) { toast("请先查询签到活动"); return; }
        const values = {};
        document.querySelectorAll("[data-checkin-field]").forEach(el => {
          const title = el.dataset.checkinField;
          if (title) values[title] = el.value;
        });
        try {
          const options = {};
          if (activity.location_required) {
            options.lng = state.checkinLocation.lng || activity.location_longitude || "";
            options.lat = state.checkinLocation.lat || activity.location_latitude || "";
            if (!options.lng || !options.lat) {
              toast("请填写目标经纬度");
              return;
            }
          }
          const result = await api(`/api/checkin/${encodeURIComponent(state.checkinProvider)}/sign`, {method: "POST", body: {code: activity.code, values, options}});
          state.checkinResult = result;
          state.checkinError = "";
        } catch (err) {
          state.checkinError = err.message;
        }
        await renderPage();
      });
      return;
    }


    // 打开学号绑定弹窗
    if (action === "open-bind-dialog") {
      openBindModal();
      return;

    if (action === "submit-modal-bind") {

        if (!studentId) throw new Error("请输入学号");
        await api("/api/student/bind", {
          method: "POST",
          body: { encrypted: await encryptedFields({student_id: studentId, password}) }
        });
        closeModal();
        toast("统一认证信息已绑定");
        await refreshAllData();
        await renderPage();
      });
      return;
    }

    // 保存个人中心认证学号
    if (action === "save-student-bind") {
      await withButtonLoading(actionBtn, async () => {
        const studentId = $("profile-sid").value.trim();
        const password = $("profile-spw").value;
        if (!studentId) throw new Error("请输入学号");
        await api("/api/student/bind", {
          method: "POST",
          body: { encrypted: await encryptedFields({student_id: studentId, password}) }

        toast("统一认证信息已更新");

        await renderPage();
      });

    // 开关自动签到

      await withButtonLoading(actionBtn, async () => {
        const result = await api("/api/signin/auto", {
          method: "POST",
          body: { enabled: enable }
        });
        const actualEnabled = Boolean(result.auto_signin ?? enable);
        state.student = { ...(state.student || {}), auto_signin: actualEnabled };
        if (state.user?.student) state.user.student.auto_signin = actualEnabled;
        if (state.signinSchedule) state.signinSchedule.enabled = actualEnabled;
        toast(actualEnabled ? "自动签到已开启" : "自动签到已关闭");

        await renderPage();
      });
      return;
    }

    // 上传 TD 照片
    if (action === "upload-td-photos") {
      await withButtonLoading(actionBtn, async () => {
        const inEl = $("td-in");
        const outEl = $("td-out");
        const inPhoto = inEl && inEl.files[0];
        const outPhoto = outEl && outEl.files[0];

        if (!inPhoto && !outPhoto) {
          throw new Error("请选择入口或出口打卡机照片");
        }

        const fd = new FormData();
        if (inPhoto) fd.append("entrance", inPhoto);
        if (outPhoto) fd.append("exit", outPhoto);

        const res = await api("/api/td/photos", {
          method: "POST",
          body: fd
        });
        state.tdStatus = { ...(state.tdStatus || {}), has_entrance_photo: Boolean(inPhoto) || Boolean(state.tdStatus?.has_entrance_photo), has_exit_photo: Boolean(outPhoto) || Boolean(state.tdStatus?.has_exit_photo) };
        toast(res.message || "打卡照片已成功保存");
      });
      return;
    }

    // 直接发起 TD 打卡
    if (action === "run-td") {
      await withButtonLoading(actionBtn, async () => {
        const studentId = String(state.student?.student_id || "").trim();
        if (!studentId) throw new Error("请先绑定统一认证学号");

        const entranceFile = $("td-in")?.files?.[0];
        const exitFile = $("td-out")?.files?.[0];
        const saved = state.tdStatus || {};
        if ((!entranceFile || !exitFile) && !(saved.has_entrance_photo && saved.has_exit_photo)) {
          throw new Error("请同时选择入口和出口照片，或先保存已有照片");
        }
        if (entranceFile || exitFile) {
          if (!entranceFile || !exitFile) throw new Error("请同时选择入口和出口照片");
          const fd = new FormData();
          fd.append("entrance", entranceFile);
          fd.append("exit", exitFile);
          await api("/api/td/photos", { method: "POST", body: fd });
        }

        const gapMinutes = Number($("td-gap-minutes")?.value || 4);
        if (!Number.isInteger(gapMinutes) || gapMinutes < 1 || gapMinutes > 15) throw new Error("时间差需为 1～15 分钟的整数");
        const result = await api("/api/td/manual", {
          method: "POST",
          body: {
            campus: $("td-campus")?.value || "xueyuanlu",
            entrance_machine_id: Number($("td-entrance-machine")?.value),
            exit_machine_id: Number($("td-exit-machine")?.value),
            gap_seconds: gapMinutes * 60
          }
        });
        if (!result.success) throw new Error(result.message || "TD 打卡未成功完成");
        toast(result.message || "TD 打卡完成");
        await renderPage();

      `);
      return;
    }

    // 抖音 Cookie 获取教程
    if (action === "show-douyin-cookie-guide") {
      openDouyinCookieGuide();
      return;
    }

    // 打开 Cookie 导入弹窗
    if (action === "open-cookie-dialog") {
      openCookieModal();
      return;
    }

    // 提交 Cookie 导入
    if (action === "submit-modal-cookies") {
      await withButtonLoading(actionBtn, async () => {
        const cookies = $("modal-cookies").value.trim();
        if (!cookies) throw new Error("请输入 Cookie 内容");
        await api("/api/douyin/session", {
          method: "POST",
          body: { encrypted_secret: await encryptLargeSecret(cookies) }
        });
        state.douyinFriendResults = [];
        state.douyinFriendsLoaded = false;
        state.douyinFriendsError = "";
        state.douyinFriendQuery = "";
        closeModal();
        toast("Cookie 导入成功，旧目标已为安全起见清空");
        await refreshAllData();
        await renderPage();
      });
      return;
    }


    // 从抖音聊天页重新读取完整好友列表
    if (action === "refresh-douyin-friends") {
      await loadDouyinFriendList(actionBtn, true);
      return;
    }

    // 添加好友到续火花列表
    if (action === "add-spark-friend") {
      const friend = normalizeSparkTarget({
        name: actionBtn.dataset.name || "",
        conversation_id: actionBtn.dataset.conversationId || "",
        conversation_short_id: actionBtn.dataset.conversationShortId || "",
        conversation_type: actionBtn.dataset.conversationType || "",
        mode: "standard",
        message: ""
      });
      if (!friend.name) return;
      if (!state.sparkTargets.some(item => sparkConversationKey(item) === sparkConversationKey(friend))) {
        state.sparkTargets.push(friend);
        toast(`已添加${friend.conversation_type === "group" ? "群聊" : "好友"} ${friend.name}，保存配置后生效`);
      }
      refreshSparkFriendEditors();
      return;
    }

    // 从续火花列表移除好友
    if (action === "remove-spark-target") {
      const index = Number(actionBtn.dataset.index);
      if (Number.isInteger(index) && index >= 0 && index < state.sparkTargets.length) {
        state.sparkTargets.splice(index, 1);
        refreshSparkFriendEditors();
      }
      return;
    }

    // 保存火花配置
    if (action === "save-spark-config") {
      const enable = actionBtn.dataset.enable === "true";
      await withButtonLoading(actionBtn, async () => {
        const config = readSparkConfigFromForm();
        config.enabled = enable;

        await api("/api/douyin/config", {
          method: "PUT",
          body: config
        });
        toast("火花配置已成功保存！");
        await refreshAllData();
        await renderPage();
      });
      return;
    }

    // 仅向当前配置中的一个稳定会话发送真实测试消息
    if (action === "run-spark-target") {
      const index = Number(actionBtn.dataset.index);
      const visibleTarget = state.sparkTargets[index];
      if (!visibleTarget?.conversation_id || !["direct", "group"].includes(visibleTarget.conversation_type)) {
        toast("该目标缺少稳定会话标识，请重新添加");
        return;
      }
      const visibleMessage = visibleTarget.mode === "custom"
        ? visibleTarget.message
        : ($("spark-default-msg")?.value || "续火花").trim();
      if (!confirm(`将向“${visibleTarget.name}”真实发送一条“${visibleMessage || "续火花"}”，确定继续吗？`)) return;
      await withButtonLoading(actionBtn, async () => {
        const config = readSparkConfigFromForm();
        const target = config.targets[index];
        if (!target?.conversation_id) throw new Error("目标状态已变化，请刷新页面后重试");
        await api("/api/douyin/config", { method: "PUT", body: config });
        const res = await api("/api/douyin/run-target", {
          method: "POST",
          body: { target_key: sparkConversationKey(target) }
        });
        toast(res.message || `已完成“${target.name}”的单独测试`);
        await refreshAllData();
        await renderPage();
      });
      return;
    }

    // 立即执行一次发火花
    if (action === "run-spark-now") {
      await withButtonLoading(actionBtn, async () => {
        const res = await api("/api/douyin/run", { method: "POST", body: {} });
        toast(res.message || "续火花任务已执行");
      });
      return;
    }

    // 退出登录
    if (action === "logout") {
      if (!confirm("确定要退出当前账号吗？")) return;
      try {
        await api("/api/auth/logout", { method: "POST", body: {} });
      } catch {}
      clearAuthState();
      toast("已安全退出");
      switchRoute("login");
      showAuthView(false);
      return;
    }
  });

  document.addEventListener("input", (e) => {
    const checkinCode = e.target.closest("#checkin-code-input");
    if (checkinCode) {
      state.checkinCode = checkinCode.value.trim();
      return;
    }
    const checkinLng = e.target.closest("#checkin-lng-input");
    if (checkinLng) {
      state.checkinLocation.lng = checkinLng.value.trim();
      return;
    }
    const checkinLat = e.target.closest("#checkin-lat-input");
    if (checkinLat) {
      state.checkinLocation.lat = checkinLat.value.trim();
      return;
    }
    const checkinField = e.target.closest("[data-checkin-field]");
    if (checkinField && checkinField.dataset.checkinField) {
      state.checkinValues[checkinField.dataset.checkinField] = checkinField.value;
      return;
    }
    const friendSearch = e.target.closest("#spark-friend-search");
    if (friendSearch) {
      state.douyinFriendQuery = friendSearch.value;
      const resultBox = $("spark-friend-results");
      if (resultBox) resultBox.innerHTML = renderDouyinFriendResults();
      return;
    }
    const messageInput = e.target.closest(".spark-target-message");
    if (!messageInput) return;
    const index = Number(messageInput.dataset.index);
    if (Number.isInteger(index) && state.sparkTargets[index]) {
      state.sparkTargets[index].message = messageInput.value;
    }
  });

  document.addEventListener("change", (e) => {
    const checkinSelect = e.target.closest("select[data-checkin-field]");
    if (checkinSelect && checkinSelect.dataset.checkinField) {
      state.checkinValues[checkinSelect.dataset.checkinField] = checkinSelect.value;
      return;
    }
    if (e.target.closest("#td-campus")) {
      updateTdMachineOptions();
      return;
    }
    const modeSelect = e.target.closest(".spark-target-mode");
    if (!modeSelect) return;
    const index = Number(modeSelect.dataset.index);
    if (!Number.isInteger(index) || !state.sparkTargets[index]) return;
    const mode = modeSelect.value === "custom" ? "custom" : "standard";
    state.sparkTargets[index].mode = mode;
    if (mode === "standard") state.sparkTargets[index].message = "";
    refreshSparkFriendEditors();
  });

  // 监听 Hash 变化
  window.addEventListener("hashchange", () => {
    renderPage();
  });

  function connectLiveNotifications() {
    if (!state.token || state.liveSocket?.readyState === WebSocket.OPEN || state.liveSocket?.readyState === WebSocket.CONNECTING) return;
    clearTimeout(state.liveReconnectTimer);
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const socket = new WebSocket(`${protocol}//${location.host}/api/notifications/ws`);
    state.liveSocket = socket;
    socket.onopen = () => {
      socket.send(JSON.stringify({type: "auth", token: state.token}));
    };
    socket.onmessage = (event) => {
      try {
        const payload = JSON.parse(event.data);
        if (payload.type !== "notification" || !payload.item) return;
        const item = payload.item;
        if (!state.notes.some(existing => existing.id === item.id)) state.notes.unshift(item);
        toast(item.content || item.body || item.title || "收到新通知");
        if ("Notification" in window && Notification.permission === "granted") {
          const notice = new Notification(item.title || "盐的工具箱", { body: item.content || item.body || "" });
          if (item.url) notice.onclick = () => window.open(item.url, "_blank", "noopener");
        }
      } catch {}
    };
    socket.onclose = () => {
      if (state.liveSocket === socket) state.liveSocket = null;
      if (state.token) state.liveReconnectTimer = setTimeout(connectLiveNotifications, 5000);
    };
  }

  // 应用启动入口
  async function bootApp() {
    const keepLogin = localStorage.getItem(STORAGE_KEYS.saveLogin) === "true";
    // The HttpOnly cookie is the source of truth for persistent login. Always
    // reconcile it at startup so a stale local token cannot mask a valid
    // server-side session.
    if (keepLogin) {
      await restorePersistentSession();
    }
    if (!state.token) {
      const current = getRoute();
      showAuthView(current === "register");
      return;
    }

    try {
      await refreshAllData();
      connectLiveNotifications();
      await renderPage();
    } catch (err) {
      if (String(err.message).includes("未登录")) {
        clearAuthState();
        switchRoute("login");
      } else {
        toast(err.message, "error");
        await renderPage();
      }
    }
  }

  // 页面加载完成后自启
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bootApp);
  } else {
    bootApp();
  }
})();
</script>
</body>
</html>
